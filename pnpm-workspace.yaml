packages:
  - 'apps/*'

autoInstallPeers: true
allowBuilds:
  '@firebase/util': set this to true or false
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  less: true
  msgpackr-extract: true
  nx: true
  prisma: true
  protobufjs: set this to true or false
  sharp: set this to true or false
  unrs-resolver: true

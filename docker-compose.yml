services:
  postgres:
    image: postgres:16-alpine
    container_name: savi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: savi_user
      POSTGRES_PASSWORD: savi_password
      POSTGRES_DB: savi_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U savi_user -d savi_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

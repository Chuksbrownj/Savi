services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: savi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: savi_user
      POSTGRES_PASSWORD: savi_password
      POSTGRES_DB: savi_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U savi_user -d savi_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: savi_redis
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API (dev hot-reload via pnpm start:dev) ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: savi_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://savi_user:savi_password@postgres:5432/savi_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev_secret_change_in_production_must_be_32_chars_min
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      STORAGE_PROVIDER: s3
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      # Prisma v7 — tell the CLI not to download Rust engine binaries (uses WASM)
      PRISMA_CLI_QUERY_ENGINE_TYPE: none
    ports:
      - '3000:3000'
    volumes:
      # Bind-mount the source code for hot-reload
      - .:/app
      # Named volume protects node_modules (including the pnpm virtual store and
      # the generated .prisma/client/) from being overwritten by the bind-mount above.
      # Docker applies volumes BEFORE bind-mounts, so this takes precedence.
      - api_node_modules:/app/node_modules
      # Named volume protects the Nx cache from the host bind-mount.
      # The host's .nx/ may contain stale Windows-path cache entries that
      # cause "Could not find dist/apps/api/main.js" on first boot.
      - api_nx_cache:/app/.nx
      # Named volume protects the build output from the host bind-mount.
      # The host's dist/ contains Windows-path Nx cache entries; protecting
      # it ensures webpack always writes to a clean Linux-path dist/ inside
      # the container and the serve executor can find main.js.
      - api_dist:/app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Named volume for the API's node_modules — preserves the pnpm virtual store
  # and generated Prisma client across container restarts and source bind-mounts.
  api_node_modules:
    driver: local
  # Named volume for the Nx build cache — prevents the host's stale Windows-path
  # cache from being mounted into the Linux container and causing build failures.
  api_nx_cache:
    driver: local
  # Named volume for the webpack build output — prevents the host's Windows-built
  # dist/ (with backslash paths in Nx cache) from shadowing the container's output.
  api_dist:
    driver: local
